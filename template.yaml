AWSTemplateFormatVersion: 2010-09-09

Description: sam-playground

Transform:
  - AWS::Serverless-2016-10-31

Parameters:
  Stage:
    Type: String
    AllowedValues: [dev, prod]
    Description: Deployment stage (set per environment via samconfig.toml parameter_overrides)

Mappings:
  StageConfig:
    dev:
      QuotaLimit: 50
    prod:
      QuotaLimit: 100

Globals:
  Api:
    # Prevents SAM from also creating the implicit extra "Stage" stage
    OpenApiVersion: 3.0.1

Resources:
  ApiGatewayApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub sam-playground-${Stage}
      StageName: !Ref Stage
      Auth:
        ApiKeyRequired: true
        UsagePlan:
          CreateUsagePlan: PER_API
          UsagePlanName: !Sub sam-playground-${Stage}
          Quota:
            Limit: !FindInMap [StageConfig, !Ref Stage, QuotaLimit]
            Period: DAY
  GetHomeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: src/handlers/get-home.getHomeHandler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      Timeout: 3
      Environment:
        Variables:
          STAGE: !Ref Stage
      Events:
        GetHome:
          Type: Api
          Properties:
            Path: /
            Method: Get
            RestApiId: !Ref ApiGatewayApi
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
  GetTestFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: src/handlers/get-test.getTestHandler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      Timeout: 3
      Environment:
        Variables:
          STAGE: !Ref Stage
      Events:
        GetTest:
          Type: Api
          Properties:
            Path: /test
            Method: Get
            RestApiId: !Ref ApiGatewayApi
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020

Outputs:
  HelloWorldApi:
    Description: API Gateway endpoint URL for Prod stage for Hello World function
    Value: !Sub https://${ApiGatewayApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${ApiGatewayApi.Stage}
  GetTestFunction:
    Description: Hello World Lambda Function ARN
    Value: !GetAtt GetTestFunction.Arn
  GetTestFunctionIamRole:
    Description: Implicit IAM Role created for Hello World function
    Value: !GetAtt GetTestFunctionRole.Arn
  ApiKeyId:
    Value: !Ref ApiGatewayApi.ApiKey
  ApiKeyConsoleUrl:
    Value: !Sub
      - "https://${AWS::Region}.console.aws.amazon.com/apigateway/main/api-keys/${KeyId}?region=${AWS::Region}"
      - KeyId: !Ref ApiGatewayApi.ApiKey
  ApiKeyGetValueCommand:
    Value: !Sub
      - "aws apigateway get-api-key --api-key ${KeyId} --include-value --query value --output text"
      - KeyId: !Ref ApiGatewayApi.ApiKey
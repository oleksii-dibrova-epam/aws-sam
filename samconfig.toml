# More information about the configuration file can be found here:
# # https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-sam-cli-config.html
version = 0.1

[default.global.parameters]
stack_name = "sam-playground"
region = "eu-north-1"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
s3_prefix = "sam-playground"
image_repositories = []

[default.package.parameters]
resolve_s3 = true

[default.sync.parameters]
watch = true

[default.local_start_api.parameters]
warm_containers = "EAGER"

[default.local_start_lambda.parameters]
warm_containers = "EAGER"

# ----------------------------- dev
[development.deploy.parameters]
stack_name = "sam-playground-dev"
role_arn = "arn:aws:iam::038084590744:role/aws-sam-cli-managed-devel-CloudFormationExecutionRo-hvFTPj5y6fCk"
s3_bucket = "aws-sam-cli-managed-development-pi-artifactsbucket-09wigedsqros"
s3_prefix = "sam-playground-dev"
capabilities = "CAPABILITY_IAM"
parameter_overrides = "Stage=dev"
confirm_changeset = false
fail_on_empty_changeset = false

# ----------------------------- prod
[production.deploy.parameters]
stack_name = "sam-playground-prod"
role_arn = "arn:aws:iam::038084590744:role/aws-sam-cli-managed-produ-CloudFormationExecutionRo-9CnrT4aeNWh6"
s3_bucket = "aws-sam-cli-managed-production-pip-artifactsbucket-aqbytzxkreqa"
s3_prefix = "sam-playground-prod"
capabilities = "CAPABILITY_IAM"
parameter_overrides = "Stage=prod"
confirm_changeset = false
fail_on_empty_changeset = false
name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment (holds AWS_ROLE_ARN / AWS_REGION vars and protection rules)
        required: true
        type: string
      sam-config-env:
        description: Section in samconfig.toml
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: deploy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    # One deployment per environment at a time; never cancel a running deploy
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      # Needed for samconfig.toml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sam-build
          path: .aws-sam/build

      - uses: aws-actions/setup-sam@341eee193f458fa5aae5d52c94b0c5cf3a1c5a52 # v3
        with:
          use-installer: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Debug OIDC claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | python3 -c 'import sys,json,base64; p=sys.stdin.read().split(".")[1]; p+="="*(-len(p)%4); c=json.loads(base64.urlsafe_b64decode(p)); print(json.dumps({k:c.get(k) for k in ["sub","aud","environment","ref","repository"]}, indent=2))'
          echo "Role: ${{ vars.AWS_ROLE_ARN }}"
          echo "Role: ${{ vars.AWS_REGION }}"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --config-env "${{ inputs.sam-config-env }}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset